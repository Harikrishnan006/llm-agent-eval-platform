name: Agent Evaluation

# Runs the deterministic evaluation suite on every push and PR.
# The job fails if quality regressed against the committed baseline, so a
# degraded agent version cannot merge silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      # The judge is deliberately not used in CI: an LLM call can time out or
      # return malformed JSON, and a build gate must be reproducible.
      - name: Run agent evaluation
        run: |
          python scripts/run_eval.py \
            --type trace \
            --version "${GITHUB_SHA::7}" \
            --json-out regression-report.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report.json
          if-no-files-found: ignore

      - name: Comment regression summary on PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "Evaluation regression detected. See the regression-report"
          echo "artifact for the metric-by-metric breakdown."
